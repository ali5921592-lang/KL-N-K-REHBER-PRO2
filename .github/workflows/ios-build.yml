name: iOS IPA Derle

# App Store Connect'e gönderilecek sürümler yalnızca bilinçli bir manuel dispatch
# ile üretilir. Push/release tetikleyicileri yanlış sürüm yüklenmesini önlemek için
# özellikle kullanılmaz.
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle Identifier'
        required: true
        default: 'com.klinikrehberpro.app'
        type: string
      marketing_version:
        description: 'App Store sürümü'
        required: true
        default: '1.1.0'
        type: string
      build_number:
        description: 'Build numarası'
        required: true
        default: '77'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15-intel

    steps:
      - name: Kodu al (checkout)
        uses: actions/checkout@v4

      - name: Xcode sürümünü seç
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: xcpretty kur
        run: gem install xcpretty --no-document

      - name: NPM bağımlılıklarını kur
        run: npm install

      - name: Capacitor iOS platformunu ekle / mevcut projeyi kullan
        run: |
          set -euo pipefail
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Uygulama ikonu ve splash görsellerini üret
        run: npx capacitor-assets generate --ios

      - name: Reklam kimliklerini (AdMob) projeye işle
        run: python3 scripts/patch-ads.py

      - name: Podfile'ı yamala
        run: python3 scripts/patch-podfile.py

      - name: CocoaPods bağımlılıklarıyla iOS senkronizasyonu
        run: npx cap sync ios

      - name: AdMob Swift düzeltmesi
        run: python3 scripts/patch-admob-swift.py

      - name: iOS projesini düzenle
        run: python3 scripts/patch-ios.py

      - name: Privacy Manifest'i Xcode projesine ekle
        run: |
          set -euo pipefail
          gem install xcodeproj --no-document
          ruby scripts/add_privacy_manifest_to_xcodeproj.rb

      - name: Derleme parametrelerini doğrula
        id: params
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          VERSION: ${{ inputs.marketing_version }}
          BUILD_NUM: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          test -n "$BUNDLE_ID"
          test -n "$VERSION"
          test -n "$BUILD_NUM"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "Bundle ID: $BUNDLE_ID / Version: $VERSION / Build: $BUILD_NUM"

      - name: İmzalama sırları mevcut mu kontrol et
        id: signing-check
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          if [ -n "$CERT_BASE64" ] && [ -n "$CERT_PASSWORD" ] && [ -n "$PROFILE_BASE64" ] && [ -n "$TEAM_ID" ] && [ -n "$PROFILE_NAME" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "[İmzasız mod] Simulator duman testi"
        if: steps.signing-check.outputs.has_signing == 'false'
        env:
          VERSION: ${{ steps.params.outputs.version }}
          BUILD_NUM: ${{ steps.params.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            build | xcpretty
          echo "### İmzasız mod: yalnızca simulator duman testi yapıldı" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: "[İmzalı mod] Sertifika ve provisioning profile kur"
        if: steps.signing-check.outputs.has_signing == 'true'
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain

          printf '%s' "$CERT_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_FILE="$PROFILE_DIR/profile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_FILE"
          security cms -D -i "$PROFILE_FILE" > /tmp/installed_profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/installed_profile.plist)
          PROFILE_EMBEDDED_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/installed_profile.plist)
          mv "$PROFILE_FILE" "$PROFILE_DIR/${PROFILE_UUID}.mobileprovision"
          echo "Provisioning profile installed: UUID=$PROFILE_UUID / Name=$PROFILE_EMBEDDED_NAME"

      - name: "[İmzalı mod] Archive oluştur"
        if: steps.signing-check.outputs.has_signing == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUNDLE_ID: ${{ steps.params.outputs.bundle_id }}
          VERSION: ${{ steps.params.outputs.version }}
          BUILD_NUM: ${{ steps.params.outputs.build_number }}
        run: |
          set -o pipefail
          if xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive 2>&1 | tee /tmp/archive.log | xcpretty; then
            ARCHIVE_OK=1
          else
            ARCHIVE_OK=0
          fi
          if [ "$ARCHIVE_OK" -ne 1 ] || [ ! -d "build/App.xcarchive" ]; then
            echo "::error::Archive oluşturulamadı."
            grep -i "error" /tmp/archive.log || true
            cat /tmp/archive.log
            exit 1
          fi
          echo "Archive tamamlandı."

      - name: "[İmzalı mod] exportOptions.plist oluştur"
        if: steps.signing-check.outputs.has_signing == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          BUNDLE_ID: ${{ steps.params.outputs.bundle_id }}
        run: python3 scripts/generate-export-options.py

      - name: "[İmzalı mod] IPA dışa aktar"
        if: steps.signing-check.outputs.has_signing == 'true'
        run: |
          set -o pipefail
          if xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist 2>&1 | tee /tmp/export.log | xcpretty; then
            EXPORT_OK=1
          else
            EXPORT_OK=0
          fi
          if [ "$EXPORT_OK" -ne 1 ] || ! ls build/ipa/*.ipa >/dev/null 2>&1; then
            echo "::error::IPA oluşturulamadı."
            grep -i "error" /tmp/export.log || true
            cat /tmp/export.log
            exit 1
          fi
          echo "IPA dışa aktarma tamamlandı."

      - name: IPA metadata ve abonelik/ATT denetimi
        if: steps.signing-check.outputs.has_signing == 'true'
        env:
          EXPECTED_BUNDLE_ID: ${{ steps.params.outputs.bundle_id }}
          EXPECTED_VERSION: ${{ steps.params.outputs.version }}
          EXPECTED_BUILD: ${{ steps.params.outputs.build_number }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ipa/*.ipa | head -1)
          TMP_IPA_AUDIT=$(mktemp -d)
          trap 'rm -rf "$TMP_IPA_AUDIT"' EXIT
          unzip -q "$IPA" -d "$TMP_IPA_AUDIT"
          APP=$(find "$TMP_IPA_AUDIT/Payload" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          ATT_TEXT=$(/usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$APP/Info.plist")
          GAD_ID=$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$APP/Info.plist")

          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"
          test "$MIN_OS" = "15.0"
          test -n "$ATT_TEXT"
          test -n "$GAD_ID"

          if grep -RqiE 'com\.klinikrehberpro\.reklamsiz\.aylik|capacitor-plugin-cdv-purchase|cdv-purchase|purchase-bridge|StoreKit|PAID_SUBSCRIPTION' "$APP"; then
            echo "::error::IPA içinde kaldırılması gereken abonelik/IAP referansı bulundu."
            exit 1
          fi

          echo "IPA denetimi geçti: $BUNDLE_ID / $VERSION ($BUILD), MinimumOSVersion=$MIN_OS, ATT purpose string mevcut, AdMob mevcut, abonelik/IAP referansı yok."
          {
            echo "### IPA denetimi"
            echo "- Bundle ID: $BUNDLE_ID"
            echo "- Version / Build: $VERSION ($BUILD)"
            echo "- Minimum iOS: $MIN_OS"
            echo "- ATT purpose string: mevcut"
            echo "- AdMob: mevcut"
            echo "- Abonelik/IAP izleri: yok"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: IPA'yı GitHub artifact olarak yükle
        if: steps.signing-check.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: klinik-rehber-pro-ipa-build-${{ steps.params.outputs.build_number }}
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 90

      - name: App Store Connect Transporter'ı kur ve IPA'yı yükle
        if: steps.signing-check.outputs.has_signing == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_API_KEY_BASE64"

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          openssl pkey -in "$KEY_FILE" -noout >/dev/null

          TRANSPORTER_INDEX='https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/'
          TRANSPORTER_DIR="$RUNNER_TEMP/transporter"
          mkdir -p "$TRANSPORTER_DIR"
          curl --fail --location --silent --show-error "$TRANSPORTER_INDEX" -o "$TRANSPORTER_DIR/index.html"
          PKG_NAME=$(grep -oE 'iTMSTransporter[_-][0-9][A-Za-z0-9._-]*\.pkg' "$TRANSPORTER_DIR/index.html" | sort -V | tail -1)
          if [ -z "$PKG_NAME" ]; then
            echo "::error::Apple Transporter paket adı resmi dizinde bulunamadı."
            exit 1
          fi
          curl --fail --location --silent --show-error \
            "${TRANSPORTER_INDEX}${PKG_NAME}" \
            -o "$TRANSPORTER_DIR/transporter.pkg"
          sudo installer -pkg "$TRANSPORTER_DIR/transporter.pkg" -target /

          TRANSPORTER=""
          for CANDIDATE in \
            "$(xcrun --find iTMSTransporter 2>/dev/null || true)" \
            "/usr/local/itms/bin/iTMSTransporter" \
            "/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"; do
            if [ -x "$CANDIDATE" ]; then
              TRANSPORTER="$CANDIDATE"
              break
            fi
          done
          if [ -z "$TRANSPORTER" ]; then
            TRANSPORTER=$(find /Applications /usr/local -type f -name iTMSTransporter -perm -111 2>/dev/null | head -1 || true)
          fi
          if [ -z "$TRANSPORTER" ]; then
            echo "::error::iTMSTransporter executable bulunamadı."
            exit 1
          fi

          IPA=$(ls build/ipa/*.ipa | head -1)
          "$TRANSPORTER" -m upload \
            -assetFile "$IPA" \
            -apiKey "$ASC_KEY_ID" \
            -apiIssuer "$ASC_ISSUER_ID" \
            -v eXtreme
          echo "### App Store Connect Transporter yüklemesi tamamlandı" >> "$GITHUB_STEP_SUMMARY"
